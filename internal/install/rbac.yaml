# What GameFleet may do in one cluster. In the game namespace it allocates,
# reads, labels and deletes game servers, runs Fleets with their autoscalers, and
# writes the Secrets game servers need (it cannot read them back). Across the
# cluster it reads what the console shows (nodes, pods, logs, events, usage)
# and may take a node out of service and remove it.
apiVersion: v1
kind: Namespace
metadata:
  name: {{.Namespace}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gamefleet
  namespace: {{.Namespace}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gamefleet
  namespace: {{.Namespace}}
rules:
  - apiGroups: ["allocation.agones.dev"]
    resources: ["gameserverallocations"]
    verbs: ["create"]
  # patch: what it noted about finished matches, and keeping the game servers
  # of a retiring machine from taking new matches.
  - apiGroups: ["agones.dev"]
    resources: ["gameservers"]
    verbs: ["get", "list", "patch", "delete"]
  - apiGroups: ["agones.dev"]
    resources: ["fleets"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["autoscaling.agones.dev"]
    resources: ["fleetautoscalers"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gamefleet
  namespace: {{.Namespace}}
subjects:
  - kind: ServiceAccount
    name: gamefleet
    namespace: {{.Namespace}}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gamefleet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gamefleet
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gamefleet
subjects:
  - kind: ServiceAccount
    name: gamefleet
    namespace: {{.Namespace}}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gamefleet
---
# A long-lived token for GameFleet, which runs outside the cluster. GameFleet
# keeps the token it got when the cluster joined, and cannot take a new one
# yet: deleting this Secret cuts GameFleet off from the cluster.
apiVersion: v1
kind: Secret
metadata:
  name: gamefleet-token
  namespace: {{.Namespace}}
  annotations:
    kubernetes.io/service-account.name: gamefleet
type: kubernetes.io/service-account-token
